name: Gerar Animação da Cobrinha

on:
  # Executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:
    
  # Executa também a cada push no repositório
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Baixa o código do seu repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Gera os arquivos da cobrinha (SVG e GIF)
      - name: Gerar o Jogo da Cobrinha
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: enzodrida
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#6db33f,#196127,#0e4429

      # 3. Envia os arquivos gerados para uma branch chamada "output"
      - name: Enviar para a branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}